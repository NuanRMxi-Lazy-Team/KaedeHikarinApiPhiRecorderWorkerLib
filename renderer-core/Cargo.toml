[package]
name = "phi-recorder-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
license = "GPL-3.0-or-later"

[lib]
name = "phi_recorder_core"

[dependencies]
anyhow = "1.0.95"
chrono = "0.4.28"
phire = { git = "https://github.com/2278535805/phire", rev = "2cd1277e468e9c7eb0e2eb5e2b9295ce4a5cba79", package = "phire", default-features = false, features = ["log", "video"] }
tokio = { version = "1.45.0", features = ["fs", "rt", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3.16.0"
