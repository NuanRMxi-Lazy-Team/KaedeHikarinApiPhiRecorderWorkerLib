[package]
name = "phi-recorder-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
license = "GPL-3.0-or-later"

[lib]
name = "phi_recorder_core"

[dependencies]
anyhow = "1.0.95"
chrono = { version = "0.4.28", features = ["serde"] }
phire = { git = "https://github.com/NuanRMxi-Lazy-Team/phire", rev = "8b57017231143fd401fc8f559077dded767c3dfc", package = "phire", default-features = false, features = ["log", "video", "silent-audio"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.45.0", features = ["fs", "rt", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3.16.0"
