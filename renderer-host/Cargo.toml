[package]
name = "phi-renderer-host"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
license = "GPL-3.0-or-later"

[[bin]]
name = "phi-renderer-host"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.95"
async-trait = "0.1"
macroquad = { git = "https://github.com/2278535805/macroquad", default-features = false }
num-complex = "0.4.6"
phi-recorder-protocol = { path = "../renderer-protocol" }
phi-recorder-core = { path = "../renderer-core" }
phire = { git = "https://github.com/NuanRMxi-Lazy-Team/phire", rev = "8b57017231143fd401fc8f559077dded767c3dfc", package = "phire", default-features = false, features = ["log", "video", "silent-audio"] }
realfft = { version = "3.5.0", features = ["avx", "sse"] }
sasa = { git = "https://github.com/NuanRMxi-Lazy-Team/sasa", rev = "35d2a9c84cbcf8754f8d21e1c345d9f08664426e", default-features = false, features = ["cpal"] }
serde_json = "1.0.138"
tempfile = "3.16.0"
tokio = { version = "1", features = ["rt"] }
